<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit: the canvas runs under the notch and the home indicator; the
       controls over it hold themselves off with env(safe-area-inset-*).
       interactive-widget: the on-screen keyboard must not resize the layout —
       it would re-shape the render and jump the picture every time you type. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual" />
  <title>fizzle</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#0b0d13" />
  <meta name="description" content="A livecoding environment for visual art, in the browser." />
  <!-- Link previews. Crawlers don't run JS, so these must stay literal here. -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://fizzle.glossing.dev/" />
  <meta property="og:title" content="fizzle" />
  <meta property="og:description" content="A livecoding environment for visual art, in the browser." />
  <meta property="og:image" content="https://fizzle.glossing.dev/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="A noise-displaced sphere lit in green and blue, with 'fizzle.' across it." />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="editor"></div>
  <div id="status"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
