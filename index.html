<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit: the canvas runs under the notch and the home indicator; the
       controls over it hold themselves off with env(safe-area-inset-*).
       interactive-widget: the on-screen keyboard must not resize the layout —
       it would re-shape the render and jump the picture every time you type. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual" />
  <title>fizzle</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#0b0d13" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="editor"></div>
  <div id="status"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
